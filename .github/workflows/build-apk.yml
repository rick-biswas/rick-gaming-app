
name: Build RICK-GAMING APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -maxdepth 4 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS")
          echo "dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Launcher Icon
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Checking Android launcher icon..."
          find . -path "*/src/main/res/*" \
            -name "ic_launcher*" -type f

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RICK-GAMING-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
