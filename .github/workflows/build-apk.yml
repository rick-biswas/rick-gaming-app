name: Build RICK-GAMING APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Gradle Wrapper files
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          exec gradle "$@"
          EOF
          chmod +x gradlew

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Normalize project files and write MainActivity
        run: |
          python3 -c '
          import glob, os, re

          # Clean manifest icon references
          for m in glob.glob("**/AndroidManifest.xml", recursive=True):
              if "build/" in m:
                  continue
              with open(m, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              new_content = re.sub(r"\s*android:(?:roundIcon|icon)=\"[^\"]*ic_launcher[^\"]*\"", "", content)
              if new_content != content:
                  with open(m, "w", encoding="utf-8") as f:
                      f.write(new_content)

          # Ensure app/build.gradle compiles cleanly on SDK 34
          for g in glob.glob("**/app/build.gradle", recursive=True):
              if "build/" in g:
                  continue
              with open(g, "r", encoding="utf-8", errors="ignore") as f:
                  gcontent = f.read()
              gcontent = re.sub(r"compileSdk\s+\d+", "compileSdk 34", gcontent)
              gcontent = re.sub(r"targetSdk\s+\d+", "targetSdk 34", gcontent)
              if "namespace " not in gcontent:
                  gcontent = re.sub(
                      r"(android\s*\{)",
                      r"\1\n    namespace \"com.rickgaming.app\"",
                      gcontent,
                      count=1
                  )
              with open(g, "w", encoding="utf-8") as f:
                  f.write(gcontent)

          # Remove old .java files and write clean MainActivity.java
          for jdir in glob.glob("**/src/main/java", recursive=True):
              if "build/" in jdir:
                  continue
              for root, _, files in os.walk(jdir):
                  for fn in files:
                      if fn.endswith(".java"):
                          os.remove(os.path.join(root, fn))
              target_dir = os.path.join(jdir, "com", "rickgaming", "app")
              os.makedirs(target_dir, exist_ok=True)
              java_code = """package com.rickgaming.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  String url = "https://rick-biswas.github.io/RICK-GAMING/";
                  Uri uri = Uri.parse(url);
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                      intent.setPackage("com.android.chrome");
                      startActivity(intent);
                  } catch (ActivityNotFoundException e) {
                      Intent fallback = new Intent(Intent.ACTION_VIEW, uri);
                      startActivity(fallback);
                  }
                  finish();
              }
          }
          """
              with open(os.path.join(target_dir, "MainActivity.java"), "w", encoding="utf-8") as f:
                  f.write(java_code)
          '

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
