
name: Build RICK GAMING APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Check Android Project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Fix Launcher Icon
        run: |
          mkdir -p app/src/main/res/drawable

          if [ ! -f app/src/main/res/drawable/ic_launcher.png ] && \
             [ ! -f app/src/main/res/drawable/ic_launcher.xml ]; then

            cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#0B2A6F"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#4FA3FF"
                  android:pathData="M61,8L25,60h23l-5,40 40,-57L58,43z"/>
          </vector>
          EOF
          fi

      - name: Build RICK GAMING APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RICK-GAMING-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
