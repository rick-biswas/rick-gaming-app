name: Build RICK-GAMING APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html || { echo "::error::index.html রিপোর রুটে নেই"; exit 1; }
          test -f icon-512.png || { echo "::error::icon-512.png রিপোর রুটে আপলোড করো"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Create Android project
        run: |
          mkdir -p _apk/app/src/main/java/com/rickgaming/topup
          mkdir -p _apk/app/src/main/assets

          cat << 'EOF_SETTINGS' > _apk/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RICK-GAMING"
          include ':app'
          EOF_SETTINGS

          cat << 'EOF_ROOT' > _apk/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_ROOT

          cat << 'EOF_PROPS' > _apk/gradle.properties
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_PROPS

          cat << 'EOF_APP' > _apk/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.rickgaming.topup'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rickgaming.topup"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_APP

          cat << 'EOF_MANIFEST' > _apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="RICK GAMING"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_JAVA' > _apk/app/src/main/java/com/rickgaming/topup/MainActivity.java
          package com.rickgaming.topup;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("file".equals(u.getScheme())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      web.loadUrl("file:///android_asset/index.html");
                  } else {
                      web.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF_JAVA

      - name: Copy website files into app
        run: |
          tar --exclude='./.git' --exclude='./.github' --exclude='./_apk' \
              --exclude='./app' --exclude='./gradle' --exclude='./gradlew' \
              --exclude='./build.gradle' --exclude='./settings.gradle' \
              --exclude='./gradle.properties' --exclude='./local.properties' \
              --exclude='*.md' --exclude='*.yml' -cf - . \
            | tar -xf - -C _apk/app/src/main/assets

      - name: Create app icons from logo
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"; s="${pair##*:}"
            mkdir -p "_apk/app/src/main/res/mipmap-$d"
            convert icon-512.png -resize "${s}x${s}" "_apk/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Build Debug APK
        working-directory: _apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RICK-GAMING-APK
          path: _apk/app/build/outputs/apk/debug/app-debug.apk
